name: Deploy to Neocities

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Upload to Neocities
        run: |
          find . -type f \
            ! -path './.git/*' \
            ! -path './.github/*' \
            ! -path './node_modules/*' \
            ! -name 'package.json' \
            ! -name 'package-lock.json' \
            ! -name 'deploy.js' \
          | while read file; do
            curl -n \
              -F "${file#./}=@${file}" \
              "https://neocities.org/api/upload" \
              -H "Authorization: Bearer ${{ secrets.NEOCITIES_API_TOKEN }}"
          done
