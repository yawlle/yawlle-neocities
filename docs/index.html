<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>comments</title>
    <link href="https://fonts.cdnfonts.com/css/aldrich" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent !important;
        font-family: "aldrich", sans-serif;
        color: black;
      }

      /* títulos iguais aos h2/h3 do site (src/styles.css). o !important
         ganha do tema do htmlcommentbox, que carrega depois deste css */
      #HCB_comment_box h3 {
        font-family: "Silkscreen", sans-serif !important;
        font-weight: 400 !important;
        color: #16537e !important;
        text-align: center;
      }

      .comments-offline {
        text-align: center;
        color: #16537e;
      }
    </style>
  </head>
  <body>
    <script>
      var post = new URLSearchParams(location.search).get("post") || "";
      if (!/^[a-z0-9-]+$/.test(post)) {
        document.write('<p class="comments-offline">no post selected.</p>');
        post = null;
      } else {
        hcb_user = {
          PAGE: "https://yawlle.neocities.org/blog/posts/" + post + "/",
        };
      }
    </script>

    <!-- begin wwww.htmlcommentbox.com -->
    <div id="HCB_comment_box">
      <a href="http://www.htmlcommentbox.com">Comment Form</a> is loading
      comments...
    </div>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://www.htmlcommentbox.com/static/skins/bootstrap/twitter-bootstrap.css?v=0"
    />
    <script type="text/javascript" id="hcb">
      /*<!--*/ if (!window.hcb_user) {
        hcb_user = {};
      }
      (function () {
        if (!post) return;
        var s = document.createElement("script"),
          l = hcb_user.PAGE || ("" + window.location).replace(/'/g, "%27"),
          h = "https://www.htmlcommentbox.com";
        s.setAttribute("type", "text/javascript");
        s.setAttribute(
          "src",
          h +
            "/jread?page=" +
            encodeURIComponent(l).replace("+", "%2B") +
            "&mod=%241%24wq1rdBcg%24nnq7KF%2FUQJDpPaHSoI3fs1" +
            "&opts=16798&num=10&ts=1792512344956",
        );
        if (typeof s != "undefined")
          document.getElementsByTagName("head")[0].appendChild(s);
      })(); /*-->*/
    </script>
    <!-- end www.htmlcommentbox.com -->

    <script>
      setTimeout(function () {
        var box = document.getElementById("HCB_comment_box");
        if (box && box.textContent.indexOf("is loading") !== -1) {
          box.innerHTML =
            '<p class="comments-offline">comments are unavailable right now :( try again later!</p>';
        }
      }, 10000);

      function sendHeight() {
        parent.postMessage(
          {
            type: "comments-height",
            height: document.documentElement.scrollHeight,
          },
          "*",
        );
      }
      new ResizeObserver(sendHeight).observe(document.body);
      window.addEventListener("load", sendHeight);
    </script>
  </body>
</html>
