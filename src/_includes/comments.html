<div class="post-comments">
  <img src="/graphics/gr_divider_7.gif" />
  <script>
    hcb_user = {
      PAGE: "https://yawlle.neocities.org{{ page.url }}",
    };
  </script>
  {% raw %}
  <!-- begin wwww.htmlcommentbox.com -->
  <div id="HCB_comment_box">
    <a href="http://www.htmlcommentbox.com">Comment Form</a> is loading
    comments...
  </div>
  <link
    rel="stylesheet"
    type="text/css"
    href="https://www.htmlcommentbox.com/static/skins/bootstrap/twitter-bootstrap.css?v=0"
  />
  <script type="text/javascript" id="hcb">
    /*<!--*/ if (!window.hcb_user) {
      hcb_user = {};
    }
    (function () {
      var s = document.createElement("script"),
        l = hcb_user.PAGE || ("" + window.location).replace(/'/g, "%27"),
        h = "https://www.htmlcommentbox.com";
      s.setAttribute("type", "text/javascript");
      s.setAttribute(
        "src",
        h +
          "/jread?page=" +
          encodeURIComponent(l).replace("+", "%2B") +
          "&mod=%241%24wq1rdBcg%24nnq7KF%2FUQJDpPaHSoI3fs1" +
          "&opts=16798&num=10&ts=1792512344956",
      );
      if (typeof s != "undefined")
        document.getElementsByTagName("head")[0].appendChild(s);
    })(); /*-->*/
  </script>
  <!-- end www.htmlcommentbox.com -->
  {% endraw %}
  <script>
    // se o htmlcommentbox não responder, troca o "loading..." por um aviso
    setTimeout(function () {
      var box = document.getElementById("HCB_comment_box");
      if (box && box.textContent.indexOf("is loading") !== -1) {
        box.innerHTML =
          '<p class="comments-offline">comments are unavailable right now :( try again later!</p>';
      }
    }, 10000);

    // o neocities bloqueia o envio de comentários (CSP), então em produção
    // esconde o formulário e mostra só os comentários existentes
    if (location.hostname.indexOf("neocities.org") !== -1) {
      var section = document.currentScript.parentNode;
      section.classList.add("comments-readonly");
      var notice = document.createElement("p");
      notice.className = "comments-offline";
      notice.textContent = "comments are closed for now, sorry!";
      section.appendChild(notice);
    }
  </script>
</div>
